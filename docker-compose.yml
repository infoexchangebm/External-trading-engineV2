version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: algo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_secret}
      POSTGRES_DB: ${POSTGRES_DB:-trading_engine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo_api_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading_secret}@postgres:5432/${POSTGRES_DB:-trading_engine}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  trading-engine-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo_dashboard_ui
    restart: unless-stopped
    depends_on:
      - api-server
    ports:
      - "24212:24212"
    environment:
      VITE_API_URL: http://api-server:8080

volumes:
  postgres_data:
  redis_data: