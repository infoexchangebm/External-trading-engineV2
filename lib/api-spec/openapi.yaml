openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: External Trading Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: Signal generation and history
  - name: data
    description: Market data sources
  - name: webhook
    description: TradingView webhook integration
  - name: config
    description: Engine configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List signal history
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: finalSignal
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Signal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"

  /signals/summary:
    get:
      operationId: getSignalSummary
      tags: [signals]
      summary: Dashboard summary of signals
      responses:
        "200":
          description: Signal summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalSummary"

  /signals/generate:
    post:
      operationId: generateSignal
      tags: [signals]
      summary: Manually trigger signal generation for a symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalRequest"
      responses:
        "200":
          description: Generated signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"

  /data/orderbook:
    get:
      operationId: getOrderbook
      tags: [data]
      summary: Get latest order book data for all tracked symbols
      responses:
        "200":
          description: Orderbook data per symbol
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderbookEntry"

  /data/macro:
    get:
      operationId: getMacroData
      tags: [data]
      summary: Get latest macroeconomic data
      responses:
        "200":
          description: Macro data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacroData"

  /data/earnings:
    get:
      operationId: getEarningsData
      tags: [data]
      summary: Get latest earnings calendar data
      responses:
        "200":
          description: Earnings data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EarningsEntry"

  /webhook/tradingview:
    post:
      operationId: receiveTradingViewAlert
      tags: [webhook]
      summary: Receive alert from TradingView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingViewAlert"
      responses:
        "200":
          description: Alert received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"

  /webhook/send:
    post:
      operationId: sendSignalToTradingView
      tags: [webhook]
      summary: Manually send a signal to TradingView
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSignalInput"
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"

  /webhook/logs:
    get:
      operationId: listWebhookLogs
      tags: [webhook]
      summary: Get webhook event log history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
      responses:
        "200":
          description: Webhook log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookLog"

  /scanner/news:
    get:
      operationId: getScannerNews
      tags: [scanner]
      summary: Breaking news and catalyst alerts (earnings, FDA, 8-K filings)
      parameters:
        - name: symbols
          in: query
          schema:
            type: string
            description: Comma-separated symbols; defaults to engine config symbols
      responses:
        "200":
          description: News items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"

  /scanner/rvol:
    get:
      operationId: getScannerRvol
      tags: [scanner]
      summary: Relative Volume scan — flags 5x+ above 50-day average
      parameters:
        - name: symbols
          in: query
          schema:
            type: string
      responses:
        "200":
          description: RVOL entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RvolEntry"

  /scanner/momentum:
    get:
      operationId: getScannerMomentum
      tags: [scanner]
      summary: Momentum screener — price $2-$20, 2%+ move, low-float filter
      parameters:
        - name: symbols
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Momentum entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MomentumEntry"

  /scanner/options-flow:
    get:
      operationId: getScannerOptionsFlow
      tags: [scanner]
      summary: Zero-DTE options pressure — put/call ratio and market lean
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Options flow data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionsFlow"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get engine configuration
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineConfig"
    put:
      operationId: updateConfig
      tags: [config]
      summary: Update engine configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineConfig"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Signal:
      type: object
      required: [id, symbol, finalSignal, confidence, macroSignal, orderbookSignal, earningsSignal, technicalSignal, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        finalSignal:
          type: string
          enum: [BUY, SELL, NONE]
        confidence:
          type: number
        macroSignal:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        orderbookSignal:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        earningsSignal:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        technicalSignal:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        score:
          type: ["number", "null"]
        sentToTradingView:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SignalSummary:
      type: object
      required: [totalSignals, buyCount, sellCount, noneCount, avgConfidence, recentSignals, symbolBreakdown]
      properties:
        totalSignals:
          type: integer
        buyCount:
          type: integer
        sellCount:
          type: integer
        noneCount:
          type: integer
        avgConfidence:
          type: number
        recentSignals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        symbolBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SymbolStats"

    SymbolStats:
      type: object
      required: [symbol, count, lastSignal]
      properties:
        symbol:
          type: string
        count:
          type: integer
        lastSignal:
          type: ["string", "null"]
        lastConfidence:
          type: ["number", "null"]

    SignalRequest:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
        sendToTradingView:
          type: boolean
          default: false

    OrderbookEntry:
      type: object
      required: [symbol, imbalance, signal, bidVolume, askVolume, updatedAt]
      properties:
        symbol:
          type: string
        imbalance:
          type: number
        signal:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
        bidVolume:
          type: number
        askVolume:
          type: number
        updatedAt:
          type: string
          format: date-time

    MacroData:
      type: object
      required: [fedSignal, inflationSignal, updatedAt]
      properties:
        fedSignal:
          type: string
          enum: [DOVISH, HAWKISH, NEUTRAL]
        inflationSignal:
          type: string
          enum: [HIGH, LOW, NEUTRAL]
        gdp:
          type: ["string", "null"]
        cpi:
          type: ["string", "null"]
        vix:
          type: ["number", "null"]
        updatedAt:
          type: string
          format: date-time

    EarningsEntry:
      type: object
      required: [ticker, reportDate]
      properties:
        ticker:
          type: string
        reportDate:
          type: string
        epsEstimate:
          type: ["number", "null"]
        epsActual:
          type: ["number", "null"]
        surprise:
          type: ["number", "null"]
        signal:
          type: ["string", "null"]

    TradingViewAlert:
      type: object
      required: [symbol, action]
      properties:
        symbol:
          type: string
        action:
          type: string
        price:
          type: ["number", "null"]
        message:
          type: ["string", "null"]

    WebhookAck:
      type: object
      required: [status]
      properties:
        status:
          type: string
        message:
          type: ["string", "null"]

    SendSignalInput:
      type: object
      required: [symbol, finalSignal]
      properties:
        symbol:
          type: string
        finalSignal:
          type: string
          enum: [BUY, SELL, NONE]
        confidence:
          type: number
          default: 0

    WebhookLog:
      type: object
      required: [id, direction, payload, status, createdAt]
      properties:
        id:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        payload:
          type: string
          description: JSON-serialized webhook payload
        status:
          type: string
          enum: [success, error, received]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    NewsItem:
      type: object
      required: [id, headline, source, datetime]
      properties:
        id:
          type: string
        symbol:
          type: ["string", "null"]
        headline:
          type: string
        summary:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        source:
          type: string
        datetime:
          type: string
          format: date-time
        category:
          type: ["string", "null"]
        isBreaking:
          type: boolean

    RvolEntry:
      type: object
      required: [symbol, meetsFilter, signal]
      properties:
        symbol:
          type: string
        currentVolume:
          type: ["number", "null"]
        avgVolume50d:
          type: ["number", "null"]
        rvol:
          type: ["number", "null"]
        signal:
          type: string
          enum: [HIGH, NORMAL, LOW, UNAVAILABLE]
        meetsFilter:
          type: boolean
        note:
          type: ["string", "null"]

    MomentumEntry:
      type: object
      required: [symbol, meetsAll, meetsPrice, meetsMomentum, meetsFloat]
      properties:
        symbol:
          type: string
        price:
          type: ["number", "null"]
        change:
          type: ["number", "null"]
        changePercent:
          type: ["number", "null"]
        volume:
          type: ["number", "null"]
        floatShares:
          type: ["number", "null"]
        floatMillions:
          type: ["number", "null"]
        meetsPrice:
          type: boolean
        meetsMomentum:
          type: boolean
        meetsFloat:
          type: boolean
        meetsAll:
          type: boolean
        note:
          type: ["string", "null"]

    OptionsFlow:
      type: object
      required: [symbol, sentiment]
      properties:
        symbol:
          type: string
        expiration:
          type: ["string", "null"]
        putVolume:
          type: ["number", "null"]
        callVolume:
          type: ["number", "null"]
        putCallRatio:
          type: ["number", "null"]
        sentiment:
          type: string
          enum: [BEARISH, BULLISH, NEUTRAL, UNAVAILABLE]
        totalOpenInterest:
          type: ["number", "null"]
        note:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time

    EngineConfig:
      type: object
      required: [id, symbols, tradingViewWebhookUrl, macroWeight, orderbookWeight, earningsWeight, technicalWeight, signalThreshold, autoSendEnabled, updatedAt]
      properties:
        id:
          type: integer
        symbols:
          type: array
          items:
            type: string
        tradingViewWebhookUrl:
          type: string
        macroWeight:
          type: number
        orderbookWeight:
          type: number
        earningsWeight:
          type: number
        technicalWeight:
          type: number
        signalThreshold:
          type: number
        autoSendEnabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    EngineConfigInput:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
        tradingViewWebhookUrl:
          type: string
        macroWeight:
          type: number
        orderbookWeight:
          type: number
        earningsWeight:
          type: number
        technicalWeight:
          type: number
        signalThreshold:
          type: number
        autoSendEnabled:
          type: boolean
