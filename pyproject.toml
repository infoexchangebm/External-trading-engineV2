[project]
name = "external-trading-engine"
version = "2.0.0"
description = "Multi-signal trading engine: macro, order book, earnings and technical scoring with risk-managed dispatch."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "config"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "venv",
  "node_modules",
  "artifacts",
  "lib",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI dependency defaults are idiomatic
  "S104",   # binding 0.0.0.0 is intentional inside containers
  "SIM105", # explicit try/except is clearer in fetch paths
  "UP042",  # str+Enum kept for pydantic/JSON serialisation compatibility
  "ASYNC109", # explicit timeout params are part of the fetch helper API
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = "(artifacts|lib|node_modules|venv|\\.venv)"
