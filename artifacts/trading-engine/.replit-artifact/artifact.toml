kind = "web"
previewPath = "/"
title = "Trading Engine"
version = "1.0.0"
id = "artifacts/trading-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24212

[services.development]
run = "pnpm --filter @workspace/trading-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trading-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/trading-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24212"
BASE_PATH = "/"
