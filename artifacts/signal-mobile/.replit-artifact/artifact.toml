kind = "mobile"
previewPath = "/mobile/"
title = "Signal Monitor"
version = "1.0.0"
id = "artifacts/signal-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 24180

[services.development]
run = "pnpm --filter @workspace/signal-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/signal-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/signal-mobile", "run", "serve" ]

[services.env]
PORT = "24180"
BASE_PATH = "/mobile/"
